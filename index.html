<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const storageKey = 'sv_theme';
        const valid = new Set(['light', 'dark', 'system']);
        const stored = localStorage.getItem(storageKey);
        const basePath = '/salesvision';
        const pathname = window.location.pathname.startsWith(basePath)
          ? (window.location.pathname.slice(basePath.length) || '/')
          : window.location.pathname;
        const loginRoute = pathname.startsWith('/login');
        const mode = loginRoute ? 'system' : (valid.has(stored) ? stored : 'system');
        const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const effective = mode === 'system' ? (systemDark ? 'dark' : 'light') : mode;
        document.documentElement.dataset.theme = effective;
        document.documentElement.dataset.themeMode = mode;
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <title>salesvision</title>
  </head>

  </body>
</html>
